<div></div>
<h3>Game</h3>
<div *ngIf="supportsTouch" class="mobile">
  <input
    placeholder="Tap to open keyboard"
    type="text"
    autocapitalize="off"
    (input)="onMobileInputChange($event)"
  />
</div>
<div class="container">
    <div class="current-typing">
        {{ currentTyping }}
      </div>
  <div
    class="current-kana"
    [@correct]="nextKanaSubject | async"
    (@correct.done)="onCorrectAnimationDone($event)"
    [@incorrect]="incorrectSubject | async"
    (@incorrect.done)="onIncorrectAnimationDone($event)"
  >
    {{ currentKana }}
  </div>

</div>
<div class="counter">
    <div *ngIf="gameMode === 'classic'">
      Kanas left: {{ queue.length }} <button (click)="onHint()">Hint</button
      ><span>{{ hint }}</span>
    </div>
    <div *ngIf="gameMode === 'deathmatch'">
      Kanas survived: {{ deathmatchCounter }} <span>It was: {{ hint }}</span>
    </div>
  </div>
  <div>Score: {{ score }} <span
    class="score-add"
    [@score]="scoreSubject | async"
    (@score.done)="onScoreAnimationDone($event)"
    ><span *ngIf="lastAddScore !== 0">+{{lastAddScore}}</span></span></div>
  <button (click)="startNewGame()">Reset</button>
